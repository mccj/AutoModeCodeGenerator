# =============================================================================
# Release — 手动发布 NuGet 包
# =============================================================================
# 用途：在 GitHub Actions 页面手动触发，测试 → 打包 → 上传 artifact → 推 NuGet.org。
# 触发：仅 workflow_dispatch（不会在 push/PR 时自动运行）。
#
# 前置配置（仓库 Settings → Secrets and variables → Actions）：
#   NUGET_API_KEY — NuGet.org 账户 API Key
#                 https://www.nuget.org/account/apikeys
#
# 手动运行：Actions → Release → Run workflow
#   - version 留空：自动计算 1.0.0.(run_number + VERSION_OFFSET)
#   - version 填写：使用指定版本，如 1.0.0.19
# =============================================================================

name: Release

# -----------------------------------------------------------------------------
# 触发条件：仅手动
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动：1.0.0.run_number+VERSION_OFFSET）'
        required: false
        type: string

# -----------------------------------------------------------------------------
# 工作流级环境变量（所有 job/step 可用）
# -----------------------------------------------------------------------------
env:
  # 自动版本号的偏移量，用于与 NuGet 已有版本衔接。
  # 公式：1.0.0.(github.run_number + VERSION_OFFSET)
  # 例：run_number=1、OFFSET=17 → 1.0.0.18
  # 若改为从 1.0.0.1 起算，将 VERSION_OFFSET 设为 "0"。
  VERSION_OFFSET: "17"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 确定本次发布的包版本，写入 steps.ver.outputs.version 供后续步骤使用
      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # 手动输入优先
            VERSION="${{ inputs.version }}"
          else
            # 自动：1.0.0.{build}，build = run_number + VERSION_OFFSET
            VERSION="1.0.0.$(( ${{ github.run_number }} + ${VERSION_OFFSET} ))"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version ${VERSION}"

      # Release 配置下跑全量测试，通过后才允许打包发布
      - name: Test
        run: dotnet test src/AutoModeCodeGenerator.slnx -c Release

      # 仅打包 Analyzers 项目（GeneratePackageOnBuild 在 NugetPackage.props 中启用）
      # -p:Version 覆盖 csproj 内 <Version>，无需提交版本变更
      - name: Pack
        run: |
          dotnet pack src/AutoModeCodeGenerator.Analyzers/AutoModeCodeGenerator.Analyzers.csproj \
            -c Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o ./artifacts

      # 将 .nupkg 存为 workflow artifact，可在 Actions 运行页下载
      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # 推送到 NuGet.org 官方源
      # --skip-duplicate：若该版本已存在则跳过，避免重复发布导致 workflow 失败
      - name: Push to NuGet.org
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/AutoModeCodeGenerator.slnx

      - name: Build
        run: dotnet build src/AutoModeCodeGenerator.slnx --no-restore

      - name: Test
        run: dotnet test src/AutoModeCodeGenerator.slnx --no-build --verbosity normal
